name: CIPP Frontend Deploy

on:
  workflow_run:
    workflows: ["CIPP Frontend Build"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy CIPP Frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Download from Azure Blob Storage
        run: |
          mkdir -p deployment
          az storage blob download \
            --connection-string "${{ secrets.AZURE_CONNECTION_STRING }}" \
            --container-name cipp \
            --name latest.zip \
            --file deployment/latest.zip

      - name: Extract Build Files
        run: |
          cd deployment
          unzip -q latest.zip
          ls -la out/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_WAVE_068A26310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "deployment/out"
          output_location: ""
